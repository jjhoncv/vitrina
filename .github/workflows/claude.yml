# Llama al workflow del Guardián (v0.9.0). Para subir de versión, cambia el @vX.Y.Z (Dependabot lo propone).
# Claude en la nube (ADR 0024 del Guardián): «@claude» del dueño en un ticket → PR; al fusionar un PR, Claude
# toma solo el siguiente ticket de la fase (máximo 2 PRs suyos esperando revisión).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: jjhoncv/guardian/.github/workflows/guardian-claude.yml@v0.9.0
    secrets: inherit
